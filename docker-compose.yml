# =============================================================================
# docker-compose.yml — ЗАПУСК ПРОЕКТА ОДНОЙ КОМАНДОЙ.
# -----------------------------------------------------------------------------
#     docker compose up -d      запустить в фоне
#     docker compose logs -f    смотреть логи
#     docker compose down       остановить (данные сохранятся)
#
# ── ЧТО ТАКОЕ DOCKER COMPOSE ───────────────────────────────────────────────
# Это описание запуска в виде файла. Одна команда вместо длинной строки
# с десятком флагов. Плюс конфигурация хранится в репозитории рядом с кодом,
# а не в чьей-то голове.
# =============================================================================

services:
  # Имя сервиса. Оно же становится именем контейнера и сетевым именем:
  # из другого сервиса к нему можно обратиться по адресу http://orpheus-bbs:3000
  orpheus-bbs:
    # ── ИМЯ ОБРАЗА ──────────────────────────────────────────────────────────
    # Без этой строки Docker Compose назвал бы образ по имени ПАПКИ проекта:
    # например, personal-music-player-orpheus-bbs. Имя менялось бы при
    # переименовании папки — неудобно.
    #
    # Явное `image:` закрепляет понятное имя, не зависящее от папки:
    #     docker images          → orpheus-bbs:latest
    #     docker run orpheus-bbs
    image: orpheus-bbs:latest

    # Собрать образ из Dockerfile в текущей папке.
    # `docker compose up -d --build` соберёт и сразу запустит.
    # Если образ уже собран — build пропускается (кэш), запуск мгновенный.
    build:
      context: .
      dockerfile: Dockerfile

    # Имя контейнера. Без него Docker придумает случайное вида "a3f9c1b2".
    # С понятным именем удобнее: docker logs orpheus-bbs
    container_name: orpheus-bbs

    # ── ПОРТЫ ───────────────────────────────────────────────────────────────
    # Формат "СНАРУЖИ:ВНУТРИ".
    #   3000:3000  — открыть на своём компьютере порт 3000
    #   8080:3000  — если 3000 занят, открыть сайт на localhost:8080
    ports:
      - "3000:3000"

    # ── ТОМА (VOLUMES) ──────────────────────────────────────────────────────
    # Том — это «пробирка» между папкой на хосте и папкой в контейнере.
    # Данные в томе НЕ удаляются вместе с контейнером. Это и есть ответ
    # на вопрос «удалю контейнер — музыка и библиотека не пропадут?».
    volumes:
      # 1. Музыка. Слева — папка на твоём компьютере, справа — путь внутри.
      #    :ro (read-only) — контейнер может только читать. Приложение
      #    и не должно писать в музыкальную папку; если что-то пойдёт не так,
      #    оно физически не сможет испортить файлы. Хорошая защита.
      - ./music:/music:ro

      # 2. Данные приложения: база SQLite и извлечённые обложки.
      #    Здесь запись нужна, поэтому :ro НЕ ставим.
      - ./data:/data

    # ── ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ ────────────────────────────────────────────────
    # Перекрывают то, что задано в Dockerfile. Держим настройки в одном
    # месте, чтобы было видно, как приложение сконфигурировано.
    environment:
      NODE_ENV: production
      MUSIC_DIR: /music
      DB_PATH: /data/music.db
      COVERS_DIR: /data/covers

      # ── НЕОБЯЗАТЕЛЬНЫЙ ТОКЕН ДОСТУПА К АУДИО ────────────────────────────
      # Если задать значение, аудиопоток будет отдаваться только при наличии
      # ?token=... в адресе. Зачем: плеер, запущенный дома, доступен всем
      # в той же сети (см. адрес Network в выводе сервера). Токен закрывает
      # музыку от случайных людей.
      #
      # ── ВАЖНО: значение читается СЕРВЕРОМ в момент запуска ───────────────
      # Здесь достаточно ОДНОЙ строки. Переменная NEXT_PUBLIC_STREAM_TOKEN
      # для этого НЕ подходит и её здесь быть не должно: NEXT_PUBLIC_*
      # подставляется в код в момент СБОРКИ образа, а переменные из этого
      # блока применяются позже — при запуске контейнера. Токен просто
      # не успел бы существовать, и в браузер уехала бы пустая строка.
      #
      # Поэтому сервер читает STREAM_TOKEN при каждом запросе и передаёт
      # значение в плеер обычным пропсом (см. src/app/layout.tsx).
      #
      # Значение удобно держать в файле .env рядом с docker-compose.yml —
      # docker compose подхватывает его автоматически.
      STREAM_TOKEN: ${STREAM_TOKEN:-}

    # ── ПЕРЕЗАПУСК ──────────────────────────────────────────────────────────
    # unless-stopped — поднимать контейнер автоматически после перезагрузки
    # компьютера, но не делать этого, если ты остановил его вручную.
    restart: unless-stopped

    # Ограничение на размер логов, чтобы они не заняли весь диск за месяцы
    # работы. Без этого Docker может писать логи неограниченно.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
